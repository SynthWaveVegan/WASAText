openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText
  description: WASAText, the skeleton project for Web and Software architecture course
  version: 1.0.0

tags:
  - name: "User"
    description: endpoints for users related operations
  - name: "Conversation"
    description: endpoints for conversation related operations
  - name: "Login"
    description: endpoints for loggin in action
  - name: "Photo"
    description: endpoints for photo related operations
  - name: "Message"
    description: endpoints for message related operations
  - name: "Group"
    description: endpoints for group related operations
  - name: "Like"
    description: endpoints for like related operations
  - name: "Comment"
    description: endpoints for comment related operations
  
  
paths:




  /groups/{groupId}/photo:
    parameters:
        - $ref: "#/components/parameters/groupId"

    put:
      security:
        - bearerAuth: []
      tags:
        - Group
        - Photo
      summary: sets the photo of the group
      description: |-
        sets the photo that
        the group will be seen with
      

      operationId: setGroupPhoto
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Photo"
      responses:
        "204":
          description: group photo updated succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    
  /groups/{groupId}:

    parameters:
        - $ref: "#/components/parameters/groupId"

    put:
      security:
        - bearerAuth: []
      tags:
        - Group
      summary: sets the name of the group
      description: |-
        sets the name that
        the group will be seen with
      

      operationId: setGroupName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Name"
      responses:
        "204":
          description: group name updated succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"


  /users/{userId}/group/{groupId}:
    parameters:

        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/groupId"

    delete:
      security:
        - bearerAuth: []
      tags:
        - Group
      summary: removes a user from a group
      description: |-
        removes the group from
        the user conversations
      
        
      operationId: leaveGroup
      responses:
        "204":
          description: group removed succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      security:
        - bearerAuth: []
      tags:
        - Group
      summary: add another user to group
      description: |-
        takes an existing group and
        adds a user with a conversation in it
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Name"
      responses:
        "204":
          description: guser added succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/group:
    parameters:
        - $ref: "#/components/parameters/userId"
    post:
      security:
        - bearerAuth: []
      tags:
        - Group
      summary: add a user to a group
      description: |-
        creates a new group or adds a user in an existing one
      
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: group created successfully
          content:
            application/json: 
              schema:
                $ref: "#/components/schemas/Group" 
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/conversations/{conversationId}/messages/readstatus:
    parameters:

        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/conversationId"
    put:
      security:
        - bearerAuth: []
      tags:
        - Message
      summary: marks message as read
      description: |-
        updates status of message in conversation
      
        
      operationId: markMessageRead
      responses:
        "204":
          description: message updated succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/conversations/{conversationId}/messages:

    parameters:

        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/conversationId"
    post:
      security:
        - bearerAuth: []
      tags:
        - Message
      summary: creates a message in a conversation
      description: |-
        sends a message to a user
        or a group conversation
      

      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json: 
            schema:
              $ref: "#/components/schemas/MessageBody" 
          multipart/form-data:
            schema:
              type: object
              required : [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: message created succesfully
          content:
            application/json: 
              schema:
                $ref: "#/components/schemas/Message" 
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/conversations/{conversationId}/messages/{messageId}:

    parameters:

        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/messageId"
        - $ref: "#/components/parameters/conversationId"
    delete:
      security:
        - bearerAuth: []
      tags:
        - Message
      summary: deletes a message
      description: |-
        removes a message 
        of a specific user
      
        
      operationId: deleteMessage
      responses:
        "204":
          description: message removed succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  
  /users/{userId}/conversations/{conversationId}/messages/{messageId}/forwarded:

    parameters:

        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/messageId"
        - $ref: "#/components/parameters/conversationId"
    post:
      security:
        - bearerAuth: []
      tags:
        - Message
      summary: forwards a message in another conversation
      description: |-
        sends a message already existent
        to another conversation
      
        
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json: 
            schema:
              $ref: "#/components/schemas/Identifier"
      responses:
        "201":
          description: message forwarded succesfully
          content:
            application/json: 
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  
  /users/{userId}/messages/{messageId}/comments:

    parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/messageId"
    post:
      security:
        - bearerAuth: []
      tags:
        - Comment
        - Message
      summary: comments a message
      description: |-
        add a comment to a 
        message of a specific user
      

      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBody"
      responses:
        "201":
          description: comment created succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/messages/{messageId}/comments/{commentId}:

    parameters:

        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/messageId"
        - $ref: "#/components/parameters/commentId"
    delete:
      security:
        - bearerAuth: []
      tags:
        - Comment
        - Message
      summary: deletes a comment
      description: |-
        removes a comment to a 
        message of a specific user
      

      operationId: uncommentMessage
      responses:
        "204":
          description: comment removed succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/conversations:

    parameters:
        - $ref: "#/components/parameters/userId"
    post:
      security:
        - bearerAuth: []
      tags:
        - Conversation
      summary: creates a new conversation
      description: |-
        generates a new conversation
        between two users
      

      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ChatName:
                  $ref: "#/components/schemas/Name"
      responses:
        "201":
          description: conversation created succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
              
              
    get:
      security:
        - bearerAuth: []
      tags:
        - Conversation
      summary: returns all the conversations
      description: |-
        returns personal stream of conversations
        for the user
      operationId: getMyConversations
      responses:
        "200":
          description: conversations retrieved succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    
  /users/{userId}/conversations/{conversationId}:

    parameters:

        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/userId"
    get:
      security:
        - bearerAuth: []
      tags:
        - Conversation
      summary: returns a specific conversation
      description: |-
        finds a specific conversation
        from its id
      

      operationId: getConversation
      responses:
        "200":
          description: conversation retrieved succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /login:
    post:
      security:
        - bearerAuth: []
      tags:
        - Login
      summary: logs in the  user
      description: |-
        if the user does not exist it will be created
        else it will be logged in; either way the userId is returned
      operationId: doLogin
      requestBody:
        description: Username to be used for loggin in
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Name"

        required: true

      responses:
        "201":
          description: user log in action succesful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identifier"

        "400":
          $ref: "#/components/responses/BadRequest"

        "403":
          $ref: "#/components/responses/Forbidden"

        "500":
          $ref: "#/components/responses/InternalServerError"

          
  /users/{userId}:

    parameters:

        - $ref: "#/components/parameters/userId"

    get:
      security:
        - bearerAuth: []
      tags:
        - User
      summary: gets a specific user
      operationId: getUser
      responses:
        "200":
          description: user retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      security:
        - bearerAuth: []
      tags:
        - User
      summary: sets the name of the user
      description: |-
        sets the name that
        the user will be seen with
      

      operationId: setMyUserName
      requestBody:
        required: true
        description: creates/changes your own username
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Name"
      responses:
        "204":
          description: username updated succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/photo:
    
    parameters:

        - $ref: "#/components/parameters/userId"
    put:
      security:
        - bearerAuth: []
      tags:
        - User
        - Photo
      summary: sets the photo of the user
      description: |-
        sets the photo that
        the user will be seen with
      
        
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Photo"
              
      responses:
        "204":
          description: user photo updated succesfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    userId:
      description: identifier for a single user
      schema:
        $ref: "#/components/schemas/Identifier"
      name: userId
      in: path
      required: true

    messageId:
      description: identifier for a single message
      schema:
        $ref: "#/components/schemas/Identifier"
      name: messageId
      in: path
      required: true

    commentId:
      description: identifier for a single comment
      schema:
        $ref: "#/components/schemas/Identifier"
      name: commentId
      in: path
      required: true

    groupId:
      description: identifier for a single group
      schema:
        $ref: "#/components/schemas/Identifier"
      name: groupId
      in: path
      required: true

    conversationId:
      description: identifier for a single conversation
      schema:
        $ref: "#/components/schemas/Identifier"
      name: conversationId
      in: path
      required: true

  responses:
    
      BadRequest:
        description: syntax of the request was not compliant with docs, check parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
    
      Forbidden:
        description: server will not accept request due to lacking of client permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
    
      NotFound:
        description: resource not found

      InternalServerError:
        description: the server encountered an error while processing the request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'


  schemas:

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Photo:
      type: object
      required: [photoUrl]
      properties:
        photoUrl:
          type: string
          format: url
          minLength: 10
          maxLength: 2048
          pattern: '^https?://.*$'
          description: New photo URL for the user

    Name:
      type: object
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 16
      

    Identifier:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: "^@[A-Z][0-9]{9}$"
          minLength: 11
          maxLength: 11

    User:
      title: user
      description: local user
      type: object
      required: [Username, userId, UserPhoto]
      properties:
        Username:
          $ref: "#/components/schemas/Name"
        userId:
          $ref: "#/components/schemas/Identifier"
        UserPhoto:
          $ref: "#/components/schemas/Photo"

    MessageBody:
      type: object
      required: [MessageBody]
      properties:
        MessageBody:
          type: string
          example: ciao
          minLength: 1
          maxLength: 50

    Message:
      title: message
      description: message of a user in a conversation
      type: object
      required: [MessageBody, Comments, UploaderId, Uploader, messageId, Date, MediaType, ConversationId, IsRead, IsForwarded]
      properties:
        MessageBody: 
          type: string
          example: ciao
          minLength: 1
          maxLength: 50
        Comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        UploaderId:
          $ref: "#/components/schemas/Identifier"
        Uploader:
          $ref: "#/components/schemas/User"
        messageId:
          $ref: "#/components/schemas/Identifier"
        Date:
          type: string
          format: date-time
          example: "2021-05-12T09:00:00Z"
          minLength: 20
          maxLength: 20
        MediaType:
          type: string
          enum:
            - text
            - photo
          description: Type of media in the message
        ConversationId:
          $ref: "#/components/schemas/Identifier"
        IsRead:
          type: string
          enum:
            - yes
            - no
        IsForwarded:
          type: string
          enum:
            - yes
            - no

    CommentBody:
      type: object
      required: [CommentBody]
      properties:
        CommentBody:
          type: string
          pattern: "^[a-z0-9]*?$"
          minLength: 1
          maxLength: 4

    Comment:
      title: comment
      description: comment of a message
      type: object
      required: [commentId, messageId, CommentBody, Date, UploaderId, Uploader]
      properties:
        commentId:
          $ref: "#/components/schemas/Identifier"
        messageId:
          $ref: "#/components/schemas/Identifier"
        CommentBody:
          type: string
          minLength: 1
          maxLength: 4
        Date:
          type: string
          format: date-time
          example: "2021-05-12T09:00:00Z"
          minLength: 20
          maxLength: 20
        UploaderId:
          $ref: "#/components/schemas/Identifier"
        Uploader:
          $ref: "#/components/schemas/User"
    
    Group:
      title: group
      description: group conversation of multiple users
      type: object
      required: [groupId, GroupName, Users, Messages, ChatPhoto]
      properties:
        groupId:
          $ref: "#/components/schemas/Identifier"
        GroupName:
          $ref: "#/components/schemas/Name"
        Users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        Messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        ChatPhoto:
          $ref: "#/components/schemas/Photo"

    CreateGroupRequest:
      type: object
      required: [Name, conversationId]
      properties:
        Name:
          type: string
          example: filippohd
          minLength: 1
          maxLength: 16
        conversationId:
          $ref: "#/components/schemas/Identifier"

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/Conversation"
              - $ref: "#/components/schemas/Group"

    Conversation:
      title: conversation
      description: conversation on the platform
      type: object
      required: [conversationId, Users, ChatName, Messages, IsGroup]
      properties:
        conversationId:
          $ref: "#/components/schemas/Identifier"
        Users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        ChatName:    
          $ref: "#/components/schemas/Name"
        Messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        IsGroup:
          type: string
          enum:
            - yes
            - no
        ChatPhoto:
          $ref: "#/components/schemas/Photo"
        

            
